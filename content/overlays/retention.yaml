# Retention policy
#
# Decision: a run is retained for at most 7 days from finalisation (or creation
# when abandoned). A share link lasts up to 7 days, but is capped at the earliest
# included run's deletion deadline. Sharing never extends retention.
#
# This is deliberately aggressive on data minimisation, and it has a real cost that
# the interface must state rather than bury: a profile needs 3-5 completed
# scenarios, and every run in it expires 7 days after it was finalised. Anyone who
# spreads three scenarios across three weeks will lose the first before finishing
# the third. The profile screen therefore shows the count *and* the days left.
#
# Note the clock: completed runs use their finalised timestamp; abandoned runs use
# creation time. A link therefore may live for less than share_ttl_days when it
# includes an older run, but it can never remain live after that run is purged.
version: "1.3.2"
kind: retention
share_ttl_days: 7
run_retention_days: 7
profile_window_days: 7
# Backups DO include the run tables, and rotation is 7 days. So the real ceiling a
# participant should be told is run_retention_days + backup_rotation_days = 14 days:
# deleted in the live system at day 7, still inside a backup until it rotates at day 14.
# The consent text states this rather than claiming a flat 7.
backup_rotation_days: 7
clock: finalized_at_or_created_at
delete_model: physical
soft_delete: false
