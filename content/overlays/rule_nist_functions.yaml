# BoardSim — NIST Cybersecurity Framework 2.0 function per decision rule
#
# 07_ACCEPTANCE_TESTS.md asks each rule to name a NIST function, so a board
# reader can see which part of the operating model a rule belongs to. That
# mapping is authored judgement, not law: it lives here as a versioned overlay
# and is marked SIMULATION_ASSUMPTION.
#
# Why an overlay rather than the rule catalogue: 03_DECISION_RULES.md is
# SHA-256 pinned and immutable. Adding a presentation mapping there would change
# the pinned bytes and every policy hash. This file is loaded on its own, is
# reported with its own version and hash in GET /v1/glossary, and is deliberately
# NOT part of the regulatory or content bundles — so no run's pins move.
#
# The function is the primary CSF 2.0 category the rule belongs to:
#   GV Govern · ID Identify · PR Protect · DE Detect · RS Respond · RC Recover
# A rule with a defensible secondary function keeps its primary here; the
# mapping is a navigation aid, not a compliance claim.

schema_version: "1.0.0"
overlay_id: "rule_nist_functions"
version: "1.0.0"

provenance:
  source_kind: SIMULATION_ASSUMPTION
  counsel_reviewed: false
  psychometrically_calibrated: false

