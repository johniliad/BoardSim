# BoardSim — F-2 Layer 2: authored regulatory facts per scenario
#
# These are fictional entity and incident facts, tagged REGULATORY_ASSERTION or
# SCENARIO_INJECT. They never assert law: they supply the inputs that the Layer 1
# predicates evaluate. Every value traces to text in the pinned scenario file, and
# the evidence is recorded in `rationale`.
#
# Resolution rule: within a key the highest visible_from_stage wins, so an S2
# assertion deterministically overrides its S1 placeholder.
#
# Reconciliation note: BS-003 and BS-013 deliberately differ from the first draft
# of the F-2 specification. That draft held BS-003 at PENDING_CLASSIFICATION for
# every stage and declared BS-013 outside DORA scope. Both contradict the pinned
# scenario text, which is the fact of record here. See overlays/README.md.

