# BoardSim — content version 1.3.2: option-to-rule corrections
#
# The specification README lists "scenario option-to-rule mappings" as the
# sanctioned way to customise scoring. Because the scenario files are SHA-256
# pinned, corrections cannot be made in place; this overlay supplies them as a
# new content version and the pinned files are never touched.
#
# CHANGELOG
# ---------
# 1.3.0 — wording-only rewrite of the fourteen pinned scenarios (executive
#   register: BLUF briefings, board-level authorisation language, distinct
#   trade-offs). No scenario_id, stage, option id, `rules` mapping, `effects`
#   field or score input changed, and the `from_rules` guards below still match
#   the pinned mappings, so every published score remains reproducible.
# 1.2.0 — option-to-rule corrections (two mis-mappings fixed).
#
# What this overlay is NOT
# ------------------------
# It does not attempt to make every option score equally. The dominance audit
# (docs/dominance-register.md) shows that in 32 of 42 stages the first option
# outscores the others, but in the large majority of those the alternatives are
# authored as plainly poor choices, for example "Publish 100% readiness using
# self-attestations only" or "Conceal open issues until inspection". Flattening
# those would remove the teaching signal the scenarios exist to deliver.
#
# What it corrects
# ----------------
# Only mappings where the authored rule contradicts what the option actually
# does. Each remap must restate the pinned mapping in `from_rules`, so if the
# pinned scenario ever changes the overlay fails closed instead of silently
# overriding a different binding.

schema_version: "1.0.0"
overlay_id: "scenario_option_remap"
content_version: "1.3.2"
supersedes: "1.3.0"

provenance:
  source_kind: SIMULATION_ASSUMPTION
  counsel_reviewed: false
  psychometrically_calibrated: false

option_remaps:
  BS-005:
    S1:
      B:
        from_rules: [DR-007, DR-036, DR-008]
        to_rules: [DR-007, DR-036, DR-008, DR-023]
        reason: Migrating rapidly with documented but thin safeguards is control
          adaptation to a constrained window (DR-023). Same option family and the
          same justification as BS-004 S2 B; the convergence is content, not fitting.
    S2:
      B:
        from_rules: [DR-008, DR-007, DR-018]
        to_rules: [DR-008, DR-007, DR-023]
        reason: The option is "Accept restrictions for a price discount and
          document residual exposure". DR-018 (Neglect known operational
          dependencies) contradicts a choice that explicitly documents its own
          exposure. DR-023 (Adapt controls to operational context) describes what
          accepting a contractual constraint actually is.

  BS-012:
    S1:
      C:
        from_rules: [DR-012, DR-018]
        to_rules: [DR-025, DR-018]
        reason: The option is "Purchase generic assurance without applicability
          review". DR-012 (Commission independent specialist assistance) rewards
          a behaviour this option does not exhibit. Buying generic assurance is
          outsourcing a capability without scoping it, which is DR-025. This
          correction makes the stage score lower for C, not higher, and is made
          for accuracy rather than for balance.

  # Content 1.2.0 — close the three narrow dominance gaps.
  #
  # In each of these stages the winning option maps to three positive rules while
  # the runner-up maps to fewer, so the margin was partly authored asymmetry, not
  # content quality. A third rule the option genuinely earns closes the gap below
  # 1.00 without ever letting the alternative overtake the winner. The negative
  # rules on failure modes are deliberately left alone.

  BS-002:
    S1:
      C:
        from_rules: [DR-013, DR-002]
        to_rules: [DR-013, DR-002, DR-003]
        reason: Observing under increased logging and keeping operations live
          earns evidence preservation (DR-003), because the logs kept are the
          evidence. The option already earns DR-013 for bounded monitoring; this
          is the missing third.

  BS-004:
    S2:
      B:
        from_rules: [DR-007, DR-008, DR-036]
        to_rules: [DR-007, DR-008, DR-036, DR-023]
        reason: A documented, time-bounded exception is the practice of adapting
          controls to operational context (DR-023). The option already earns DR-007
          and DR-008 for the published boundary and the named owner.
