# BoardSim — F-2 Layer 1: global regulatory instrument registry
#
# Each REG-xxx anchor from 04_REGULATORY_REGISTER.md is defined ONCE here with
# its scope and trigger predicate. Legal counsel reviews and signs off on a
# predicate once, not once per scenario stage.
#
# reporting_duty is the field that makes the DR-027 guard sound. Standing
# governance duties (NIS2 Art. 21, GDPR Art. 32, DORA Art. 5/6/28) are TRIGGERED
# merely by being in scope, so they must never satisfy a notification guard.
#
# Provenance policy: the three governance fields are declared once in the
# `provenance` block below and materialised onto every entry in the compiled
# bundle, so the emitted artefact carries a declared value per instrument.
# Any entry needing a different value must override it explicitly, which the
# loader enforces by rejecting a silent mismatch against `counsel_signed_off`.

schema_version: "1.0.0"
overlay_id: "regulatory_instruments"
regulatory_overlay_version: "1.1.0"

provenance:
  source_kind: AUTHORITATIVE_SOURCE
  counsel_reviewed: false
  psychometrically_calibrated: false

instruments:
  # --- NIS2 Directive (EU) 2022/2555 ---
  REG-NIS2-21:
    title: "NIS2 Directive — Art. 21 (Cybersecurity risk-management measures)"
    source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022L2555"
    nature: LAW
    verification_tier: VERIFIED_TOP_LEVEL_LAW
    reporting_duty: false
    counsel_signed_off: false
    scope_expr: "entity_in_scope AND national_transposition_applicable"
    trigger_expr: "entity_in_scope AND national_transposition_applicable"
    timers: []

  REG-NIS2-23:
    title: "NIS2 Directive — Art. 23 (Reporting obligations)"
    source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022L2555"
    nature: LAW
    verification_tier: VERIFIED_TOP_LEVEL_LAW
    reporting_duty: true
    counsel_signed_off: false
    scope_expr: "entity_in_scope AND national_transposition_applicable"
    trigger_expr: "significant_incident_confirmed AND awareness_time_known"
    timers:
      - id: NIS2_EARLY_WARNING
        label: "Early warning to the CSIRT or competent authority"
        anchor_fact: awareness_time
        offset_hours: 24
      - id: NIS2_INCIDENT_NOTIFICATION
        label: "Incident notification"
        anchor_fact: awareness_time
        offset_hours: 72
      - id: NIS2_FINAL_REPORT
        label: "Final report, one calendar month after the incident notification"
        anchor_event: notification_submitted_at
        calendar: "+1 month"
        projection_from_timer: NIS2_INCIDENT_NOTIFICATION

