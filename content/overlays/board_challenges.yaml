# Board-room challenge cards
#
# 06_INTERFACE_AND_ACCESSIBILITY.md asks for "three challenge cards from chair,
# CFO and CEO" in the board room, plus a five-minute suggested preparation timer.
#
# The cards are PROMPTS FOR THE CONVERSATION. They are not board fields, they add
# no rule, and nothing typed in response is read by the engine. `06` also states
# that free text is for dialog only and never an undisclosed grading input, so the
# safe design is for the cards to exist entirely outside the scoring path.
#
# They are scenario-agnostic on purpose: 42 bespoke cards (3 x 14 scenarios) would
# be a content project with a sign-off cost, and the questions a real board asks
# are the same regardless of the fictional industry.
version: "1.3.2"
kind: board_challenges
provenance:
  source_kind: SIMULATION_ASSUMPTION
  counsel_reviewed: false
  psychometrically_calibrated: false
preparation:
  suggested_minutes: 5
  scoring: false
  auto_start: false
  hard_stop: false
  note: "Suggested time only. Nothing happens when it elapses; the board pack stays open."
challenges:
  - id: CHAIR-01
    from: Chair
    title: Name the decision
    probe: What is the single decision you are asking this board to take today, and what specific new information would make you change it?
  - id: CFO-01
    from: CFO
    title: Bound the money
    probe: What are we committing, what is the boundary of that commitment, and what do we spend if this runs twice as long as planned?
  - id: CEO-01
    from: CEO
    title: Test the downside
    probe: If this is materially worse in forty-eight hours, what is already prepared, and who has agreed to it?
